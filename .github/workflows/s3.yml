name: s3
run-name: s3

on:
  push:
    path:
      - .github/workflows/s3.yml
  workflow_dispatch:


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4


      - name: upload artifcats
        uses: actions/upload-artifact@v4
        with:
          name: test
          path: |
            ${{ github.workpace }}

      - name: zip
        run: |
          pwd
          echo ${{ github.workspace }}
          ls -la
          zip -r artifacts.zip .
          ls -la

